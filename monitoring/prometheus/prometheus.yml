global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s
  external_labels: {lab: hito13-g09}
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: api
    static_configs:
      - targets: [api:8000]
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
  - job_name: blackbox
    static_configs:
      - targets: [blackbox:9115]
  - job_name: probes
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets: [http://api:8000/health/live]
        labels: {component: api}
      - targets: [http://influxdb:8181/health]
        labels: {component: influxdb}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
